<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PassEngine">
    <title>Password Engine Standalone</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/zxcvbn/4.4.2/zxcvbn.js"></script>
    <script src="palabras.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 5px;
            font-size: 1.5em;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 0.85em;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .pass-container {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            padding: 15px;
            box-sizing: border-box;
        }
        .password {
            background-color: #0f172a;
            color: #a6e3a1;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            font-family: ui-monospace, SFMono-Regular, "Courier New", monospace;
            font-size: 0.95em;
            text-align: center;
            border: 1px solid #334155;
            word-break: break-all;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
            position: relative;
        }
        .password:active {
            transform: scale(0.98);
        }
        .password.copied {
            background-color: #064e3b;
            color: #6ee7b7;
            border-color: #059669;
        }
        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 15px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            max-width: 420px;
            margin-top: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.15s ease;
        }
        .btn:active {
            background-color: #1d4ed8;
            transform: scale(0.99);
        }
    </style>
</head>
<body>

    <h1>Password Engine Standalone</h1>
    <p class="subtitle">Toca cualquier contraseña para copiarla</p>

    <div class="pass-container" id="contenedor-passwords">
        <div class="password">Generando contraseñas...</div>
    </div>

    <button class="btn" onclick="mostrarBloque()">⚡ Generar Nuevas</button>

    <script>
        // Filtro estricto para limpiar el diccionario de palabras que Apple penaliza:
        // 1. Sin caracteres repetidos consecutivos (ll, rr, ee, oo, cc)
        // 2. Solo letras a-z (sin ñ ni tildes)
        // 3. Al menos 4 caracteres únicos por palabra para maximizar entropía por bloque
        function esPalabraAltaEntropia(w) {
            if (!/^[a-z]+$/.test(w)) return false;
            if (/(.)\1/.test(w)) return false; // Penalización por repetición adyacente
            const unicos = new Set(w.split("")).size;
            return unicos >= (w.length - 1); // Evita patrones tipo "banana", "radar", "sosos"
        }

        const RAW_5 = (typeof PALABRAS_5 !== "undefined" && PALABRAS_5.length >= 3)
            ? PALABRAS_5
            : ["timbo", "chote", "tusca", "fuego", "cable", "disco", "pluma", "punto"];

        const RAW_6 = (typeof PALABRAS_6 !== "undefined" && PALABRAS_6.length >= 3)
            ? PALABRAS_6
            : ["hoyita", "codero", "pecina", "yesera", "vector", "filtro", "origen", "bloque"];

        const LISTA_5 = RAW_5.filter(esPalabraAltaEntropia);
        const LISTA_6 = RAW_6.filter(esPalabraAltaEntropia);

        // Generador criptográfico sin sesgo de módulo
        function getRandomInt(max) {
            const array = new Uint32Array(1);
            window.crypto.getRandomValues(array);
            return array[0] % max;
        }

        function generarContrasena666() {
            // Excluir 0 y 1 para evitar ambigüedad visual (O, l, I)
            const digitos = "23456789";
            const numero = digitos[getRandomInt(digitos.length)];

            const p5 = LISTA_5[getRandomInt(LISTA_5.length)];
            let idx1 = getRandomInt(LISTA_6.length);
            let idx2 = getRandomInt(LISTA_6.length);
            while (idx1 === idx2) {
                idx2 = getRandomInt(LISTA_6.length);
            }
            const p6_1 = LISTA_6[idx1];
            const p6_2 = LISTA_6[idx2];

            // Posiciones internas junto a los guiones (estilo nativo de Apple):
            // Modo 0: [p5 + num] - [p6_1] - [p6_2]  (ej: chote4-codero-pecina)
            // Modo 1: [p6_1] - [p5 + num] - [p6_2]  (ej: petate-tusca4-muenda)
            // Modo 2: [p6_1] - [num + p5] - [p6_2]  (ej: petate-4tusca-muenda)
            // Modo 3: [p6_1] - [p6_2] - [num + p5]  (ej: hoyita-diente-7timbo)
            const modoPosicion = getRandomInt(4);
            let bloques = [];
            let idxBloqueConNumero = 0;

            if (modoPosicion === 0) {
                bloques = [`${p5}${numero}`, p6_1, p6_2];
                idxBloqueConNumero = 0;
            } else if (modoPosicion === 1) {
                bloques = [p6_1, `${p5}${numero}`, p6_2];
                idxBloqueConNumero = 1;
            } else if (modoPosicion === 2) {
                bloques = [p6_1, `${numero}${p5}`, p6_2];
                idxBloqueConNumero = 1;
            } else {
                bloques = [p6_1, p6_2, `${numero}${p5}`];
                idxBloqueConNumero = 2;
            }

            // Elegir un bloque que NO tenga el número para capitalizar
            const candidatosBloque = [0, 1, 2].filter(i => i !== idxBloqueConNumero);
            const bloqueACapitalizar = candidatosBloque[getRandomInt(candidatosBloque.length)];
            const palabra = bloques[bloqueACapitalizar];
            const letras = palabra.split("");

            // CLAVE PARA EL ESCUDO VERDE:
            // Capitalizar una letra INTERNA (índices 1 al 4), NUNCA el índice 0.
            // Evita la penalización de "Title Case" en el evaluador de diccionario de Apple.
            // Además, evitamos capitalizar 'i' o 'l' o 'o' para no crear ambigüedad visual (I, L, O).
            const indicesValidos = [];
            for (let i = 1; i <= 4; i++) {
                if (!"ilo".includes(letras[i])) {
                    indicesValidos.push(i);
                }
            }
            const posMayus = indicesValidos.length > 0
                ? indicesValidos[getRandomInt(indicesValidos.length)]
                : 2; // Fallback seguro en posición 2 (como en hoYita)

            letras[posMayus] = letras[posMayus].toUpperCase();
            bloques[bloqueACapitalizar] = letras.join("");

            return bloques.join("-");
        }

        // Validador adicional de entropía de caracteres para descartar combinaciones flojas
        function pasaFiltroApple(candidata) {
            if (candidata.length !== 20) return false;
            const totalMayus = (candidata.match(/[A-Z]/g) || []).length;
            const totalNums = (candidata.match(/[0-9]/g) || []).length;
            const noEmpiezaNiTerminaNum = !/^[0-9]|.*[0-9]$/.test(candidata);
            // Verificar que la mayúscula NO esté al inicio de ningún bloque
            const sinMayusInicial = !/^[A-Z]|-[A-Z]/.test(candidata);
            // Exigir al menos 11 caracteres alfabéticos distintos en toda la clave
            const soloLetras = candidata.toLowerCase().replace(/[^a-z]/g, "");
            const letrasUnicas = new Set(soloLetras.split("")).size;

            return totalMayus === 1 && totalNums === 1 && noEmpiezaNiTerminaNum && sinMayusInicial && letrasUnicas >= 11;
        }

        async function copiarPassword(elemento, texto) {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(texto);
                } else {
                    const area = document.createElement("textarea");
                    area.value = texto;
                    area.style.position = "fixed";
                    area.style.opacity = "0";
                    document.body.appendChild(area);
                    area.focus();
                    area.select();
                    document.execCommand("copy");
                    document.body.removeChild(area);
                }

                const original = elemento.textContent;
                elemento.classList.add("copied");
                elemento.textContent = "✓ ¡Copiado al portapapeles!";

                setTimeout(() => {
                    elemento.classList.remove("copied");
                    elemento.textContent = original;
                }, 1200);
            } catch (err) {
                console.error("Error al copiar: ", err);
            }
        }

        function mostrarBloque() {
            const contenedor = document.getElementById("contenedor-passwords");
            contenedor.innerHTML = "";
            let generadas = 0;
            let intentos = 0;

            while (generadas < 10 && intentos < 500) {
                intentos++;
                const candidata = generarContrasena666();
                const score = (typeof zxcvbn === "function") ? zxcvbn(candidata).score : 4;

                if (score === 4 && pasaFiltroApple(candidata)) {
                    const div = document.createElement("div");
                    div.className = "password";
                    div.textContent = candidata;
                    div.onclick = function() {
                        copiarPassword(this, candidata);
                    };
                    contenedor.appendChild(div);
                    generadas++;
                }
            }
        }

        window.onload = mostrarBloque;
    </script>
</body>
</html>
